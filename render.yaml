# Optional Blueprint — or mirror these settings in the Render dashboard.
services:
  - type: web
    name: open-source-code-navigator-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
